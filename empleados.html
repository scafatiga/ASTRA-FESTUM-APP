<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleados - Astra Festum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/nav.css">
</head>
<body class="bg-gray-100 p-6 min-h-screen">
    <div class="max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md">

        <div class="flex justify-between items-center mb-6 pb-4 border-b">
            <h1 class="text-2xl font-bold text-gray-800">Empleados</h1>
        </div>

        <!-- Formulario de alta -->
        <form id="formEmpleado" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8 border-b pb-6" novalidate>

            <!-- 1. Nombre completo -->
            <div class="sm:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo:</label>
                <input type="text" id="nombre" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
            </div>

            <!-- 2. Gestoría (Sí/No) -->
            <div class="sm:col-span-2 flex items-center gap-2 bg-blue-50 border border-blue-200 rounded p-3">
                <input type="checkbox" id="gestoria" class="w-4 h-4">
                <label for="gestoria" class="text-sm font-semibold text-gray-800">Gestoría: ¿tramitar alta con la Gestoría?</label>
            </div>

            <!-- Bloque solo visible si Gestoría = Sí (campos 3 a 11) -->
            <div id="grupoGestoria1" class="hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">DNI / NIE:</label>
                    <input type="text" id="dni" placeholder="12345678A ó X1234567L" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                    <p id="dniError" class="text-xs text-red-600 mt-1 hidden">Documento no válido. Debe ser un DNI (8 dígitos + letra) o un NIE (letra + 7 dígitos + letra).</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nº Seguridad Social (12 dígitos):</label>
                    <input type="text" id="numeroSegSocial" maxlength="12" inputmode="numeric" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                    <p id="segSocialError" class="text-xs text-red-600 mt-1 hidden">Debe tener exactamente 12 dígitos.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nacionalidad:</label>
                    <input type="text" id="nacionalidad" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Nacimiento:</label>
                    <input type="date" id="fechaNacimiento" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">IBAN:</label>
                    <input type="text" id="iban" placeholder="ES00 0000 0000 0000 0000 0000" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                    <p id="ibanError" class="text-xs text-red-600 mt-1 hidden">El IBAN no es válido.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Domicilio:</label>
                    <input type="text" id="domicilio" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha IN (Alta):</label>
                    <input type="date" id="fechaIn" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha OUT (Baja):</label>
                    <input type="date" id="fechaOut" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Jornada Semanal (horas):</label>
                    <input type="number" step="0.5" id="horasAlta" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- 12, 13, 14: siempre visibles -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Punto de Venta:</label>
                <select id="puntoVenta" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                    <option value="">-- Selecciona --</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email:</label>
                <input type="email" id="email" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Estado:</label>
                <select id="estado" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                    <option value="true">Activo</option>
                    <option value="false">Inactivo</option>
                </select>
            </div>

            <!-- Bloque solo visible si Gestoría = Sí (campo 15) -->
            <div id="grupoGestoria2" class="hidden">
                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Foto DNI: <span class="text-xs font-normal text-gray-500">(obligatoria solo si es NIE)</span></label>
                    <input type="file" id="fotoDni" accept="image/*,.pdf" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="sm:col-span-2">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                    + Añadir Empleado
                </button>
            </div>
        </form>

        <!-- Lista -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b text-xs font-semibold text-gray-600 uppercase">
                        <th class="p-3">Nombre</th>
                        <th class="p-3">DNI</th>
                        <th class="p-3">Punto de Venta</th>
                        <th class="p-3">Fecha IN</th>
                        <th class="p-3">Fecha OUT</th>
                        <th class="p-3">Foto DNI</th>
                        <th class="p-3">Estado</th>
                        <th class="p-3">Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaEmpleados" class="divide-y text-sm">
                    <tr><td colspan="8" class="p-4 text-center text-gray-500">Cargando...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script src="/empleados.js"></script>
    <script src="/nav.js"></script>
</body>
</html>
