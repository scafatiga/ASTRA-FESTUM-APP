<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleados - Astra Festum</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 min-h-screen">
    <div class="max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md">

        <div class="flex justify-between items-center mb-6 pb-4 border-b">
            <h1 class="text-2xl font-bold text-gray-800">Empleados</h1>
            <a href="/" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded text-sm font-medium transition">
                Menu Principal
            </a>
        </div>

        <!-- Formulario de alta -->
        <form id="formEmpleado" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8 border-b pb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre:</label>
                <input type="text" id="nombre" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">DNI:</label>
                <input type="text" id="dni" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nº Seguridad Social:</label>
                <input type="text" id="numeroSegSocial" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nacionalidad:</label>
                <input type="text" id="nacionalidad" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Nacimiento:</label>
                <input type="date" id="fechaNacimiento" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">IBAN:</label>
                <input type="text" id="iban" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="sm:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Domicilio:</label>
                <input type="text" id="domicilio" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha IN (Alta):</label>
                <input type="date" id="fechaIn" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha OUT (Baja):</label>
                <input type="date" id="fechaOut" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Horas Alta:</label>
                <input type="number" step="0.5" id="horasAlta" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Punto de Venta:</label>
                <select id="puntoVenta" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                    <option value="">-- Selecciona --</option>
                </select>
            </div>
            <div class="sm:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Dirección:</label>
                <input type="text" id="direccion" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email:</label>
                <input type="email" id="email" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Foto DNI (enlace):</label>
                <input type="text" id="fotoDni" placeholder="URL a la imagen (Drive, etc.)" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="sm:col-span-2">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                    + Añadir Empleado
                </button>
            </div>
        </form>

        <!-- Lista -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b text-xs font-semibold text-gray-600 uppercase">
                        <th class="p-3">Nombre</th>
                        <th class="p-3">DNI</th>
                        <th class="p-3">Punto de Venta</th>
                        <th class="p-3">Fecha IN</th>
                        <th class="p-3">Fecha OUT</th>
                        <th class="p-3">Estado</th>
                        <th class="p-3">Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaEmpleados" class="divide-y text-sm">
                    <tr><td colspan="7" class="p-4 text-center text-gray-500">Cargando...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script src="/empleados.js"></script>
</body>
</html>
