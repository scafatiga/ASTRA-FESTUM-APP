<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Astra Festum</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-lg shadow-md max-w-sm w-full">
        <h1 class="text-2xl font-bold text-gray-800 mb-1 text-center">Astra Festum</h1>
        <p class="text-sm text-gray-500 mb-6 text-center">Inicia sesión para continuar</p>

        <form id="formLogin" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email:</label>
                <input type="email" id="email" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required autofocus>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña:</label>
                <input type="password" id="password" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
            </div>
            <p id="errorLogin" class="text-sm text-red-600 hidden"></p>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                Entrar
            </button>
        </form>

        <button id="btnMostrarOlvide" type="button" class="w-full text-center text-sm text-blue-600 hover:underline mt-4">
            ¿Olvidaste tu contraseña?
        </button>

        <form id="formOlvide" class="hidden space-y-4 mt-4 pt-4 border-t">
            <p class="text-sm text-gray-600">Escribe tu email y te enviaremos un enlace para crear una contraseña nueva.</p>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email:</label>
                <input type="email" id="emailOlvide" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
            </div>
            <p id="mensajeOlvide" class="text-sm hidden"></p>
            <button type="submit" class="w-full bg-gray-700 hover:bg-gray-800 text-white font-medium py-3 rounded-lg transition shadow">
                Enviar Enlace
            </button>
        </form>
    </div>

    <script src="/login.js"></script>
</body>
</html>
