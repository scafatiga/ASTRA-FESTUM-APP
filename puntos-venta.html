<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puntos de Venta - Astra Festum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/nav.css">
</head>
<body class="bg-gray-100 p-6 min-h-screen">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">

        <div class="flex justify-between items-center mb-6 pb-4 border-b">
            <h1 class="text-2xl font-bold text-gray-800">Puntos de Venta</h1>
        </div>

        <!-- Formulario de alta -->
        <form id="formPuntoVenta" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8 border-b pb-6">
            <div class="sm:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Punto de Venta:</label>
                <input type="text" id="nombre" placeholder="Ej: Valencia" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Dirección:</label>
                <input type="text" id="direccion" placeholder="Calle, número, ciudad" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Stand:</label>
                <input type="text" id="tipoStand" placeholder="Ej: Isla, Local, Kiosco" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="sm:col-span-2 flex items-center gap-2">
                <input type="checkbox" id="universal" class="w-4 h-4">
                <label for="universal" class="text-sm text-gray-700">Universal <span class="text-xs text-gray-500">(sus empleados aparecen en In-Out bajo cualquier Punto de Venta — ej: La Nave, Administración)</span></label>
            </div>
            <div class="sm:col-span-2">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                    + Añadir Punto de Venta
                </button>
            </div>
        </form>

        <!-- Lista -->
        <input type="text" id="buscadorPuntosVenta" placeholder="Buscar por nombre..." class="w-full border p-2 rounded mb-3 focus:ring-2 focus:ring-blue-500">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b text-xs font-semibold text-gray-600 uppercase">
                        <th class="p-3">Nombre</th>
                        <th class="p-3">Dirección</th>
                        <th class="p-3">Tipo Stand</th>
                        <th class="p-3">Estado</th>
                        <th class="p-3">Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaPuntosVenta" class="divide-y text-sm">
                    <tr><td colspan="5" class="p-4 text-center text-gray-500">Cargando...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- Modal: Detalle -->
    <div id="modalDetalle" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h2 class="text-lg font-bold text-gray-800">Detalle del Punto de Venta</h2>
                <button id="btnCerrarDetalle" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
            </div>
            <div id="contenidoDetalle" class="p-4 space-y-2 text-sm"></div>
        </div>
    </div>

    <!-- Modal: Editar -->
    <div id="modalEditar" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h2 class="text-lg font-bold text-gray-800">Editar Punto de Venta</h2>
                <button id="btnCerrarEditar" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
            </div>
            <form id="formEditarPuntoVenta" class="space-y-4 p-4" novalidate>
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Punto de Venta:</label>
                    <input type="text" id="editNombre" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Dirección:</label>
                    <input type="text" id="editDireccion" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Stand:</label>
                    <input type="text" id="editTipoStand" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="editUniversal" class="w-4 h-4">
                    <label for="editUniversal" class="text-sm text-gray-700">Universal <span class="text-xs text-gray-500">(aparece en In-Out bajo cualquier Punto de Venta)</span></label>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                    Guardar Cambios
                </button>
            </form>
        </div>
    </div>

    <script src="/puntos-venta.js"></script>
    <script src="/nav.js"></script>
</body>
</html>
