<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Cierre de Caja - Astra Festum</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Nuevo Cierre de Caja</h1>
      <a href="/historico.html" class="bg-gray-700 hover:bg-gray-800 text-white text-xs font-semibold px-4 py-2 rounded-lg">Ver Histórico</a>
    </div>

    <form id="formCierre" class="space-y-6">
      <!-- Fecha y Usuario -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Fecha</label>
          <input type="date" id="fecha" required class="w-full bg-gray-50 border border-gray-300 text-gray-800 text-sm rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Usuario Email</label>
          <input type="email" id="usuario_email" value="admin@astrafestum.com" readonly class="w-full bg-gray-100 border border-gray-300 text-gray-500 text-sm rounded-lg p-2.5 cursor-not-allowed">
        </div>
      </div>

      <!-- Punto de Venta Origen -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Punto de Venta</label>
        <select id="pdv_origen_id" required class="w-full bg-gray-50 border border-gray-300 text-gray-800 text-sm rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500">
          <option value="">Cargando puntos de venta...</option>
        </select>
        <p id="pdv_error_msg" class="hidden text-xs text-red-500 mt-1">No se encontraron puntos de venta</p>
      </div>

      <!-- Totales -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Total Efectivo (€)</label>
          <input type="number" step="0.01" id="total_efectivo" placeholder="0.00" required class="w-full bg-gray-50 border border-gray-300 text-gray-800 text-sm rounded-lg p-2.5">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Total Tarjeta (€)</label>
          <input type="number" step="0.01" id="total_tarjeta" placeholder="0.00" required class="w-full bg-gray-50 border border-gray-300 text-gray-800 text-sm rounded-lg p-2.5">
        </div>
      </div>

      <!-- 1. Gastos (Primero) -->
      <div class="border-t border-gray-200 pt-4">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-sm font-bold text-gray-700">Gastos Pagados con Caja</h2>
          <button type="button" onclick="agregarFilaGasto()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-semibold px-3 py-1.5 rounded-lg">+ Añadir Gasto</button>
        </div>
        <div id="contenedor_gastos" class="space-y-2"></div>
      </div>

      <!-- 2. Adelantos (Segundo) -->
      <div class="border-t border-gray-200 pt-4">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-sm font-bold text-gray-700">Adelantos a Empleados</h2>
          <button type="button" onclick="agregarFilaAdelanto()" class="bg-blue-100 hover:bg-blue-200 text-blue-700 text-xs font-semibold px-3 py-1.5 rounded-lg">+ Añadir Adelanto</button>
        </div>
        <div id="contenedor_adelantos" class="space-y-2"></div>
      </div>

      <!-- Observaciones -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Observaciones</label>
        <textarea id="observaciones" rows="3" placeholder="Notas adicionales..." class="w-full bg-gray-50 border border-gray-300 text-gray-800 text-sm rounded-lg p-2.5"></textarea>
      </div>

      <!-- Botón Guardar -->
      <button type="submit" id="btnGuardar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow transition duration-200">Guardar Cierre de Caja</button>
    </form>
  </div>

  <script>
    let listaPDVs = [];
    let listaEmpleados = [];

    document.getElementById('fecha').valueAsDate = new Date();

    async function cargarCatalogos() {
      try {
        const [resPDVs, resEmp] = await Promise.all([
          fetch('/api/puntos-venta'),
          fetch('/api/empleados')
        ]);

        if (!resPDVs.ok || !resEmp.ok) throw new Error('Error al consultar servidor');

        listaPDVs = await resPDVs.json();
        listaEmpleados = await resEmp.json();

        poblarSelectPDV();
      } catch (err) {
        console.error('Error cargando catálogos:', err);
        const select = document.getElementById('pdv_origen_id');
        select.innerHTML = '<option value="">Error de conexión</option>';
        document.getElementById('pdv_error_msg').classList.remove('hidden');
      }
    }

    function poblarSelectPDV() {
      const select = document.getElementById('pdv_origen_id');
      const errorMsg = document.getElementById('pdv_error_msg');

      if (!listaPDVs || listaPDVs.length === 0) {
        select.innerHTML = '<option value="">-- Sin Puntos de Venta --</option>';
        errorMsg.classList.remove('hidden');
        return;
      }

      errorMsg.classList.add('hidden');
      select.innerHTML = '<option value="">-- Seleccionar PDV --</option>';
      
      listaPDVs.forEach(pdv => {
        const nombreDisplay = pdv.nombre || pdv.denominacion || pdv.nombre_pdv || `PDV #${pdv.id}`;
        select.innerHTML += `<option value="${pdv.id}">${nombreDisplay}</option>`;
      });
    }

    function agregarFilaGasto() {
      const cont = document.getElementById('contenedor_gastos');
      const id = Date.now();

      let pdvOptions = '<option value="">-- Imputar a PDV --</option>';
      listaPDVs.forEach(p => {
        const nombrePdv = p.nombre || p.denominacion || `PDV #${p.id}`;
        pdvOptions += `<option value="${p.id}">${nombrePdv}</option>`;
      });

      const html = `
        <div id="gasto_${id}" class="grid grid-cols-1 md:grid-cols-3 gap-2 bg-gray-50 p-2 rounded-lg border border-gray-200">
          <input type="text" placeholder="Concepto del gasto" class="concepto bg-white border border-gray-300 text-xs rounded p-2" required>
          <select class="pdv_dest_id bg-white border border-gray-300 text-xs rounded p-2">${pdvOptions}</select>
          <div class="flex gap-2">
            <input type="number" step="0.01" placeholder="Monto (€)" class="monto bg-white border border-gray-300 text-xs rounded p-2 w-full" required>
            <button type="button" onclick="document.getElementById('gasto_${id}').remove()" class="text-red-500 hover:text-red-700 font-bold px-2">✕</button>
          </div>
        </div>
      `;
      cont.insertAdjacentHTML('beforeend', html);
    }

    function agregarFilaAdelanto() {
      const cont = document.getElementById('contenedor_adelantos');
      const id = Date.now();
      
      let empOptions = '<option value="">-- Seleccionar Empleado --</option>';
      listaEmpleados.forEach(e => {
        const nombreEmp = e.nombre_completo || `${e.nombre || ''} ${e.apellidos || ''}`.trim() || `Empleado #${e.id}`;
        empOptions += `<option value="${e.id}">${nombreEmp}</option>`;
      });

      let pdvOptions = '<option value="">-- Imputar a PDV --</option>';
      listaPDVs.forEach(p => {
        const nombrePdv = p.nombre || p.denominacion || `PDV #${p.id}`;
        pdvOptions += `<option value="${p.id}">${nombrePdv}</option>`;
      });

      const html = `
        <div id="adelanto_${id}" class="grid grid-cols-1 md:grid-cols-3 gap-2 bg-gray-50 p-2 rounded-lg border border-gray-200">
          <select class="emp_id bg-white border border-gray-300 text-xs rounded p-2" required>${empOptions}</select>
          <select class="pdv_dest_id bg-white border border-gray-300 text-xs rounded p-2">${pdvOptions}</select>
          <div class="flex gap-2">
            <input type="number" step="0.01" placeholder="Monto (€)" class="monto bg-white border border-gray-300 text-xs rounded p-2 w-full" required>
            <button type="button" onclick="document.getElementById('adelanto_${id}').remove()" class="text-red-500 hover:text-red-700 font-bold px-2">✕</button>
          </div>
        </div>
      `;
      cont.insertAdjacentHTML('beforeend', html);
    }

    document.getElementById('formCierre').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('btnGuardar');
      btn.disabled = true;
      btn.innerText = 'Guardando...';

      const pdv_origen_id = document.getElementById('pdv_origen_id').value;
      const fecha = document.getElementById('fecha').value;
      const total_efectivo = parseFloat(document.getElementById('total_efectivo').value) || 0;
      const total_tarjeta = parseFloat(document.getElementById('total_tarjeta').value) || 0;
      const observaciones = document.getElementById('observaciones').value;

      const gastos = Array.from(document.querySelectorAll('#contenedor_gastos > div')).map(div => ({
        concepto: div.querySelector('.concepto').value,
        pdv_destino_id: div.querySelector('.pdv_dest_id').value || null,
        monto: parseFloat(div.querySelector('.monto').value) || 0
      }));

      const adelantos = Array.from(document.querySelectorAll('#contenedor_adelantos > div')).map(div => ({
        empleado_id: div.querySelector('.emp_id').value,
        pdv_destino_id: div.querySelector('.pdv_dest_id').value || null,
        monto: parseFloat(div.querySelector('.monto').value) || 0
      }));

      const payload = { pdv_origen_id, fecha, total_efectivo, total_tarjeta, observaciones, adelantos, gastos };

      try {
        const res = await fetch('/api/cierre', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al guardar el cierre');

        alert('¡Cierre de caja guardado con éxito!');
        window.location.reload();
      } catch (err) {
        alert(`Error al guardar: ${err.message}`);
        btn.disabled = false;
        btn.innerText = 'Guardar Cierre de Caja';
      }
    });

    cargarCatalogos();
  </script>
</body>
</html>
