<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cierre de Caja - Astra Festum</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white p-8 rounded-lg shadow-md max-w-xl w-full">
    
    <!-- Header con navegacion limpia -->
    <div class="flex justify-between items-center mb-6 pb-4 border-b">
      <a href="/" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-1.5 rounded text-sm font-medium transition">
        Menu Principal
      </a>
      <h1 class="text-xl font-bold text-gray-800">Cierre de Caja</h1>
      <a href="/historico.html" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-sm font-medium transition">
        Ver Historico
      </a>
    </div>

    <form id="cierreForm" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
          <input type="date" id="fecha" required class="w-full border rounded p-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Punto de Venta</label>
          <select id="punto_venta" required class="w-full border rounded p-2 text-sm">
            <option value="">Seleccionar...</option>
            <option value="Astra Festum Principal">Astra Festum Principal</option>
            <option value="Barra Secundaria">Barra Secundaria</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email Responsable</label>
        <input type="email" id="usuario_email" required placeholder="usuario@astrafestum.com" class="w-full border rounded p-2 text-sm">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Total Efectivo (EUR)</label>
          <input type="number" step="0.01" id="total_efectivo" required placeholder="0.00" class="w-full border rounded p-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Total Tarjeta (EUR)</label>
          <input type="number" step="0.01" id="total_tarjeta" required placeholder="0.00" class="w-full border rounded p-2 text-sm">
        </div>
      </div>

      <!-- Section: Adelantos -->
      <div class="border p-4 rounded bg-gray-50">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Adelantos a Empleados</label>
        <div id="adelantosContainer" class="space-y-2 mb-2"></div>
        <button type="button" onclick="addAdelanto()" class="bg-green-600 text-white px-3 py-1 rounded text-xs font-medium">+ Agregar Adelanto</button>
      </div>

      <!-- Section: Gastos -->
      <div class="border p-4 rounded bg-gray-50">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Gastos de Caja</label>
        <div id="gastosContainer" class="space-y-2 mb-2"></div>
        <button type="button" onclick="addGasto()" class="bg-green-600 text-white px-3 py-1 rounded text-xs font-medium">+ Agregar Gasto</button>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones</label>
        <textarea id="observaciones" rows="3" placeholder="Incidencias, diferencias de caja, etc." class="w-full border rounded p-2 text-sm"></textarea>
      </div>

      <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white font-medium py-2.5 rounded transition">
        Guardar Cierre de Caja
      </button>
    </form>
  </div>

  <script>
    function addAdelanto() {
      const container = document.getElementById('adelantosContainer');
      const div = document.createElement('div');
      div.className = 'flex gap-2 items-center';
      div.innerHTML = '<input type="text" placeholder="Nombre empleado" class="empleado-nombre border rounded p-1.5 text-xs flex-1" required><input type="number" step="0.01" placeholder="Importe (EUR)" class="empleado-importe border rounded p-1.5 text-xs w-28" required><button type="button" onclick="this.parentElement.remove()" class="text-red-500 font-bold px-1">X</button>';
      container.appendChild(div);
    }

    function addGasto() {
      const container = document.getElementById('gastosContainer');
      const div = document.createElement('div');
      div.className = 'flex gap-2 items-center';
      div.innerHTML = '<input type="text" placeholder="Concepto del gasto" class="gasto-concepto border rounded p-1.5 text-xs flex-1" required><input type="number" step="0.01" placeholder="Importe (EUR)" class="gasto-importe border rounded p-1.5 text-xs w-28" required><button type="button" onclick="this.parentElement.remove()" class="text-red-500 font-bold px-1">X</button>';
      container.appendChild(div);
    }

    document.getElementById('cierreForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const adelantos = Array.from(document.querySelectorAll('#adelantosContainer > div')).map(div => ({
        empleado_nombre: div.querySelector('.empleado-nombre').value,
        monto: parseFloat(div.querySelector('.empleado-importe').value)
      }));

      const gastos = Array.from(document.querySelectorAll('#gastosContainer > div')).map(div => ({
        concepto: div.querySelector('.gasto-concepto').value,
        monto: parseFloat(div.querySelector('.gasto-importe').value)
      }));

      const payload = {
        fecha: document.getElementById('fecha').value,
        punto_venta: document.getElementById('punto_venta').value,
        usuario_email: document.getElementById('usuario_email').value,
        total_efectivo: parseFloat(document.getElementById('total_efectivo').value),
        total_tarjeta: parseFloat(document.getElementById('total_tarjeta').value),
        observaciones: document.getElementById('observaciones').value,
        adelantos,
        gastos
      };

      try {
        const res = await fetch('/api/cierre-caja', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          alert('Cierre de caja guardado con éxito.');
          window.location.href = '/historico.html';
        } else {
          alert('Error al guardar: ' + data.error);
        }
      } catch (err) {
        alert('Error de conexión con el servidor.');
      }
    });
  </script>
</body>
</html>
