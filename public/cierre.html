<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cierre de Caja - Astra Festum</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 min-h-screen">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
    
    <div class="flex justify-between items-center mb-6 pb-4 border-b">
      <h1 class="text-2xl font-bold text-gray-800">Astra Festum - Cierre de Caja</h1>
      <div class="flex gap-2">
        <a href="/" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded text-sm font-medium transition">Menú Principal</a>
        <a href="/historico.html" class="bg-gray-700 hover:bg-gray-800 text-white px-4 py-2 rounded text-sm font-medium transition">Ver Histórico</a>
      </div>
    </div>

    <form id="formCierre" class="space-y-6">
      
      <!-- Punto de Venta Actual -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Punto de Venta Actual (Caja Origen):</label>
        <select id="punto_venta" name="punto_venta" required class="w-full border border-gray-300 rounded p-2 focus:ring focus:ring-blue-200">
          <option value="">-- Selecciona Punto de Venta --</option>
        </select>
      </div>

      <!-- Totales -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Total Efectivo (€):</label>
          <input type="number" step="0.01" id="total_efectivo" name="total_efectivo" value="0.00" required class="w-full border border-gray-300 rounded p-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Total Tarjeta (€):</label>
          <input type="number" step="0.01" id="total_tarjeta" name="total_tarjeta" value="0.00" required class="w-full border border-gray-300 rounded p-2">
        </div>
      </div>

      <!-- Gastos / Compras Físicas -->
      <div class="border p-4 rounded-lg bg-gray-50">
        <h2 class="text-lg font-semibold text-gray-700 mb-3">Gastos / Compras Físicas</h2>
        <div id="contenedorGastos" class="space-y-3 mb-3">
          <!-- Filas de gastos dinámicas -->
        </div>
        <button type="button" id="btnAgregarGasto" class="bg-gray-700 hover:bg-gray-800 text-white text-sm px-3 py-1.5 rounded transition">+ Agregar Gasto</button>
      </div>

      <!-- Adelantos / Abonos a Empleados -->
      <div class="border p-4 rounded-lg bg-gray-50">
        <h2 class="text-lg font-semibold text-gray-700 mb-3">Adelantos / Abonos a Empleados</h2>
        <div id="contenedorAdelantos" class="space-y-3 mb-3">
          <!-- Filas de adelantos dinámicas -->
        </div>
        <button type="button" id="btnAgregarAdelanto" class="bg-gray-700 hover:bg-gray-800 text-white text-sm px-3 py-1.5 rounded transition">+ Agregar Adelanto</button>
      </div>

      <!-- Observaciones -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones / Notas de Caja:</label>
        <textarea id="observaciones" name="observaciones" rows="3" placeholder="Incidencias, diferencias de caja, etc." class="w-full border border-gray-300 rounded p-2"></textarea>
      </div>

      <!-- Botón Registrar -->
      <div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded transition">Registrar Cierre de Caja</button>
      </div>

    </form>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      let puntosVentaGlobal = [];
      let empleadosGlobal = [];

      // 1. Cargar Puntos de Venta
      try {
        const resPDV = await fetch("/api/puntos-venta");
        puntosVentaGlobal = await resPDV.json();
        
        const selectPuntoVenta = document.getElementById("punto_venta");
        puntosVentaGlobal.forEach(pdv => {
          const opt = document.createElement("option");
          opt.value = pdv.nombre;
          opt.textContent = pdv.nombre;
          selectPuntoVenta.appendChild(opt);
        });
      } catch (err) {
        console.error("Error cargando puntos de venta:", err);
      }

      // 2. Cargar Lista de Empleados desde /api/usuarios
      try {
        const resEmp = await fetch("/api/usuarios");
        if (resEmp.ok) {
          empleadosGlobal = await resEmp.json();
        }
      } catch (err) {
        console.error("Error cargando empleados:", err);
      }

      // Manejo de Gastos Dinámicos
      const contenedorGastos = document.getElementById("contenedorGastos");
      document.getElementById("btnAgregarGasto").addEventListener("click", () => {
        const div = document.createElement("div");
        div.className = "flex gap-2 items-center";
        
        let opcionesPDV = puntosVentaGlobal.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('');

        div.innerHTML = `
          <input type="text" placeholder="Concepto del gasto" class="flex-1 border border-gray-300 rounded p-2 text-sm" required>
          <input type="number" step="0.01" placeholder="Monto €" class="w-28 border border-gray-300 rounded p-2 text-sm" required>
          <select class="w-40 border border-gray-300 rounded p-2 text-sm" required>
            <option value="">-- PDV Destino --</option>
            ${opcionesPDV}
          </select>
          <button type="button" class="bg-red-600 text-white px-3 py-2 rounded text-sm hover:bg-red-700 btn-eliminar">✕</button>
        `;
        div.querySelector(".btn-eliminar").addEventListener("click", () => div.remove());
        contenedorGastos.appendChild(div);
      });

      // Manejo de Adelantos Dinámicos
      const contenedorAdelantos = document.getElementById("contenedorAdelantos");
      document.getElementById("btnAgregarAdelanto").addEventListener("click", () => {
        const div = document.createElement("div");
        div.className = "flex gap-2 items-center";
        
        let opcionesEmpleados = empleadosGlobal.map(e => `<option value="${e.id}">${e.nombre || e.usuario || 'Empleado ' + e.id}</option>`).join('');
        let opcionesPDV = puntosVentaGlobal.map(p => `<option value="${p.nombre}">${p.nombre}</option>`).join('');

        div.innerHTML = `
          <select class="flex-1 border border-gray-300 rounded p-2 text-sm" required>
            <option value="">-- Selecciona Empleado --</option>
            ${opcionesEmpleados}
          </select>
          <input type="number" step="0.01" placeholder="Monto €" class="w-28 border border-gray-300 rounded p-2 text-sm" required>
          <select class="w-40 border border-gray-300 rounded p-2 text-sm" required>
            <option value="">-- PDV Origen --</option>
            ${opcionesPDV}
          </select>
          <button type="button" class="bg-red-600 text-white px-3 py-2 rounded text-sm hover:bg-red-700 btn-eliminar">✕</button>
        `;
        div.querySelector(".btn-eliminar").addEventListener("click", () => div.remove());
        contenedorAdelantos.appendChild(div);
      });

      // Enviar Formulario
      document.getElementById("formCierre").addEventListener("submit", async (e) => {
        e.preventDefault();

        const fechaActual = new Date().toISOString().split('T')[0];
        const cierreData = {
          fecha: fechaActual,
          punto_venta: document.getElementById("punto_venta").value,
          total_efectivo: parseFloat(document.getElementById("total_efectivo").value) || 0,
          total_tarjeta: parseFloat(document.getElementById("total_tarjeta").value) || 0,
          observaciones: document.getElementById("observaciones").value
        };

        try {
          const response = await fetch("/api/cierres", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(cierreData)
          });

          if (!response.ok) throw new Error("Error al registrar el cierre");

          alert("¡Cierre registrado con éxito!");
          window.location.href = "/historico.html";
        } catch (err) {
          console.error(err);
          alert("Hubo un error al guardar el cierre.");
        }
      });
    });
  </script>
</body>
</html>
