<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historico de Cierres - Astra Festum</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 min-h-screen">
  <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md">
    
    <div class="flex justify-between items-center mb-6 pb-4 border-b">
      <h1 class="text-2xl font-bold text-gray-800">Historico de Cierres de Caja</h1>
      <div class="flex gap-2">
        <a href="/" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded text-sm font-medium transition">
          Menu Principal
        </a>
        <a href="/cierre.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-medium transition">
          Nuevo Cierre
        </a>
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-50 border-b text-xs font-semibold text-gray-600 uppercase">
            <th class="p-3">Fecha</th>
            <th class="p-3">Punto Venta</th>
            <th class="p-3">Efectivo</th>
            <th class="p-3">Tarjeta</th>
            <th class="p-3">Total</th>
            <th class="p-3">Detalles (Adelantos / Gastos)</th>
          </tr>
        </thead>
        <tbody id="tablaCierres" class="divide-y text-sm">
          <tr>
            <td colspan="6" class="p-4 text-center text-gray-500">Cargando cierres...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="/historico.js"></script>
</body>
</html>
