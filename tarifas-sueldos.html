<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarifas de Sueldos - Astra Festum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/nav.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md m-6">

        <div class="flex justify-between items-center mb-6 pb-4 border-b">
            <h1 class="text-2xl font-bold text-gray-800">Tarifas de Sueldos</h1>
        </div>

        <!-- Importar histórico desde Excel -->
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6 flex flex-col sm:flex-row sm:items-center gap-3">
            <div class="flex-1 text-sm text-gray-700">
                <span class="font-semibold">Importar Histórico</span> — Excel con columnas EMPLEADO, IMPORTE DIA, HORAS POR DIA, IMPORTE HORA, EXTRA +10 HORAS, HORAXMONTAJE, VIGENTE DESDE, VIGENTE HASTA (formato AppSheet).
            </div>
            <div>
                <input type="file" id="inputExcel" accept=".xlsx,.xls" class="hidden">
                <button type="button" id="btnImportarExcel" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded transition whitespace-nowrap">
                    📄 Subir Excel
                </button>
            </div>
        </div>
        <p id="resultadoImportacion" class="text-sm mb-6 hidden"></p>

        <!-- Formulario de alta -->
        <form id="formTarifa" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8 border-b pb-6" novalidate>
            <div class="sm:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Empleado:</label>
                <select id="empleado" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                    <option value="">-- Selecciona --</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Importe Día (€):</label>
                <input type="number" step="0.01" id="importeDia" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Horas por Día:</label>
                <input type="number" step="0.01" id="horasPorDia" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Importe Hora (€) <span class="text-xs font-normal text-gray-500">(calculado)</span>:</label>
                <input type="number" step="0.01" id="importeHora" class="w-full border p-2 rounded bg-gray-100" readonly>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Extra +10 Horas (€):</label>
                <input type="number" step="0.01" id="extraMas10Horas" value="0" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Hora x Montaje (€):</label>
                <input type="number" step="0.01" id="horaxmontaje" value="0" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Vigente Desde:</label>
                <input type="date" id="vigenteDesde" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Vigente Hasta <span class="text-xs font-normal text-gray-500">(opcional)</span>:</label>
                <input type="date" id="vigenteHasta" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" class="sm:col-span-2 w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                + Añadir Tarifa
            </button>
        </form>

        <!-- Lista (colapsada por defecto) -->
        <button id="btnToggleLista" type="button" class="w-full flex items-center justify-between bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium px-4 py-3 rounded-lg transition">
            <span>Ver Listado de Tarifas (<span id="contadorTarifas">0</span>)</span>
            <svg id="iconoToggleLista" class="w-5 h-5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
            </svg>
        </button>
        <div id="listaTarifasWrapper" class="hidden mt-3">
            <input type="text" id="buscadorTarifas" placeholder="Buscar por empleado..." class="w-full border p-2 rounded mb-3 focus:ring-2 focus:ring-blue-500">
            <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b text-xs font-semibold text-gray-600 uppercase">
                        <th class="p-3">Empleado</th>
                        <th class="p-3">Importe Día</th>
                        <th class="p-3">Importe Hora</th>
                        <th class="p-3">Vigente Desde</th>
                        <th class="p-3">Vigente Hasta</th>
                        <th class="p-3">Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaTarifas" class="divide-y text-sm">
                    <tr><td colspan="6" class="p-4 text-center text-gray-500">Cargando...</td></tr>
                </tbody>
            </table>
            </div>
        </div>

    </div>

    <!-- Modal: Detalle -->
    <div id="modalDetalle" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h2 class="text-lg font-bold text-gray-800">Detalle</h2>
                <button id="btnCerrarDetalle" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
            </div>
            <div id="contenidoDetalle" class="p-4 space-y-2 text-sm"></div>
        </div>
    </div>

    <!-- Modal: Editar -->
    <div id="modalEditar" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h2 class="text-lg font-bold text-gray-800">Editar Tarifa</h2>
                <button id="btnCerrarEditar" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
            </div>
            <form id="formEditarTarifa" class="space-y-4 p-4" novalidate>
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Empleado:</label>
                    <select id="editEmpleado" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                        <option value="">-- Selecciona --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Importe Día (€):</label>
                    <input type="number" step="0.01" id="editImporteDia" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Horas por Día:</label>
                    <input type="number" step="0.01" id="editHorasPorDia" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Importe Hora (€) <span class="text-xs font-normal text-gray-500">(calculado)</span>:</label>
                    <input type="number" step="0.01" id="editImporteHora" class="w-full border p-2 rounded bg-gray-100" readonly>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Extra +10 Horas (€):</label>
                    <input type="number" step="0.01" id="editExtraMas10Horas" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Hora x Montaje (€):</label>
                    <input type="number" step="0.01" id="editHoraxmontaje" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Vigente Desde:</label>
                    <input type="date" id="editVigenteDesde" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Vigente Hasta:</label>
                    <input type="date" id="editVigenteHasta" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                    Guardar Cambios
                </button>
            </form>
        </div>
    </div>

    <script src="/tarifas-sueldos.js"></script>
    <script src="/nav.js"></script>
</body>
</html>
