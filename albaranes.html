<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albaranes - Astra Festum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/nav.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md m-6">

        <div class="flex justify-between items-center mb-6 pb-4 border-b">
            <h1 class="text-2xl font-bold text-gray-800">Albaranes</h1>
        </div>

        <!-- Formulario de alta -->
        <form id="formAlbaran" class="space-y-4 mb-8 border-b pb-6" novalidate>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha:</label>
                    <input type="date" id="fecha" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div></div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Punto de Venta Origen:</label>
                    <select id="puntoVentaOrigen" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                        <option value="">-- Selecciona --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Punto de Venta Destino:</label>
                    <select id="puntoVentaDestino" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                        <option value="">-- Selecciona --</option>
                    </select>
                    <p id="mismoPuntoError" class="text-xs text-red-600 mt-1 hidden">El origen y el destino no pueden ser el mismo.</p>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Tipo_Stand:</label>
                <div id="tipoStandBotones" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div>
                <input type="hidden" id="tipoStand" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Tipo de Albarán:</label>
                <div id="tipoAlbaranBotones" class="grid grid-cols-3 gap-2"></div>
                <input type="hidden" id="tipoAlbaran" required>
            </div>

            <!-- Rejilla de productos: aparece en cuanto se elige el Tipo_Stand -->
            <div id="bloqueProductos" class="hidden border-t pt-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Productos (rellena solo las cantidades que apliquen):</label>
                <input type="text" id="buscadorProductosGrid" placeholder="Buscar producto..." class="w-full border p-2 rounded mb-2 focus:ring-2 focus:ring-blue-500">
                <div class="overflow-x-auto border rounded">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-gray-50 border-b text-xs font-semibold text-gray-600 uppercase">
                                <th class="p-2">Producto</th>
                                <th class="p-2 w-24">Precio</th>
                                <th class="p-2 w-24">Cantidad</th>
                                <th class="p-2 w-24">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductosGrid"></tbody>
                    </table>
                </div>
                <div class="flex justify-end mt-2 text-base font-bold text-gray-800">
                    Total Albarán: <span id="totalAlbaran" class="ml-2">0.00 €</span>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                + Guardar Albarán
            </button>
        </form>

        <!-- Lista (colapsada por defecto, más nuevo a más antiguo) -->
        <button id="btnToggleLista" type="button" class="w-full flex items-center justify-between bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium px-4 py-3 rounded-lg transition">
            <span>Ver Listado de Albaranes (<span id="contadorAlbaranes">0</span>)</span>
            <svg id="iconoToggleLista" class="w-5 h-5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
            </svg>
        </button>
        <div id="listaAlbaranesWrapper" class="hidden overflow-x-auto mt-3">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b text-xs font-semibold text-gray-600 uppercase">
                        <th class="p-3">Fecha</th>
                        <th class="p-3">Origen</th>
                        <th class="p-3">Destino</th>
                        <th class="p-3">Tipo_Stand</th>
                        <th class="p-3">Tipo</th>
                        <th class="p-3">Total</th>
                        <th class="p-3">Registrado por</th>
                        <th class="p-3">Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaAlbaranes" class="divide-y text-sm">
                    <tr><td colspan="8" class="p-4 text-center text-gray-500">Cargando...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- Modal: Detalle -->
    <div id="modalDetalle" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-lg w-full max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h2 class="text-lg font-bold text-gray-800">Detalle del Albarán</h2>
                <button id="btnCerrarDetalle" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
            </div>
            <div id="contenidoDetalle" class="p-4 space-y-2 text-sm"></div>
        </div>
    </div>

    <script src="/albaranes.js"></script>
    <script src="/nav.js"></script>
</body>
</html>
