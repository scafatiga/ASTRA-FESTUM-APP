<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socios - Astra Festum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/nav.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md m-6">

        <div class="flex justify-between items-center mb-6 pb-4 border-b">
            <h1 class="text-2xl font-bold text-gray-800">Socios</h1>
        </div>

        <!-- Formulario de alta -->
        <form id="formSocio" class="space-y-4 mb-8 border-b pb-6" novalidate>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha:</label>
                    <input type="date" id="fecha" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Punto de Venta:</label>
                    <select id="puntoVenta" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                        <option value="">-- Selecciona --</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Socio:</label>
                <div id="socioBotones" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div>
                <input type="hidden" id="socio" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Tipo:</label>
                <div id="tipoBotones" class="grid grid-cols-2 gap-2"></div>
                <input type="hidden" id="tipo" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Importe (€):</label>
                <input type="number" step="0.01" id="importe" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones:</label>
                <textarea id="observaciones" rows="2" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                + Añadir Registro
            </button>
        </form>

        <!-- Lista (colapsada por defecto, más nuevo a más antiguo) -->
        <button id="btnToggleLista" type="button" class="w-full flex items-center justify-between bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium px-4 py-3 rounded-lg transition">
            <span>Ver Listado de Socios (<span id="contadorSocios">0</span>)</span>
            <svg id="iconoToggleLista" class="w-5 h-5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
            </svg>
        </button>
        <div id="listaSociosWrapper" class="hidden overflow-x-auto mt-3">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b text-xs font-semibold text-gray-600 uppercase">
                        <th class="p-3">Fecha</th>
                        <th class="p-3">Punto de Venta</th>
                        <th class="p-3">Socio</th>
                        <th class="p-3">Tipo</th>
                        <th class="p-3">Importe</th>
                        <th class="p-3">Registrado por</th>
                        <th class="p-3">Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaSocios" class="divide-y text-sm">
                    <tr><td colspan="7" class="p-4 text-center text-gray-500">Cargando...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- Modal: Detalle -->
    <div id="modalDetalle" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h2 class="text-lg font-bold text-gray-800">Detalle</h2>
                <button id="btnCerrarDetalle" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
            </div>
            <div id="contenidoDetalle" class="p-4 space-y-2 text-sm"></div>
        </div>
    </div>

    <!-- Modal: Editar -->
    <div id="modalEditar" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h2 class="text-lg font-bold text-gray-800">Editar Registro</h2>
                <button id="btnCerrarEditar" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
            </div>
            <form id="formEditarSocio" class="space-y-4 p-4" novalidate>
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha:</label>
                    <input type="date" id="editFecha" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Punto de Venta:</label>
                    <select id="editPuntoVenta" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                        <option value="">-- Selecciona --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Socio:</label>
                    <div id="editSocioBotones" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div>
                    <input type="hidden" id="editSocio" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Tipo:</label>
                    <div id="editTipoBotones" class="grid grid-cols-2 gap-2"></div>
                    <input type="hidden" id="editTipo" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Importe (€):</label>
                    <input type="number" step="0.01" id="editImporte" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones:</label>
                    <textarea id="editObservaciones" rows="2" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                    Guardar Cambios
                </button>
            </form>
        </div>
    </div>

    <script src="/socios.js"></script>
    <script src="/nav.js"></script>
</body>
</html>
