<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Out - Astra Festum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/nav.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md m-6">

        <div class="flex justify-between items-center mb-6 pb-4 border-b">
            <h1 class="text-2xl font-bold text-gray-800">In-Out</h1>
        </div>

        <!-- Paso 1: elige Punto de Venta -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Punto de Venta:</label>
            <div id="puntosVentaBotones" class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                <div class="col-span-full text-center text-gray-400 text-sm py-4">Cargando...</div>
            </div>
        </div>

        <!-- Paso 2: aparecen los empleados de ese punto de venta -->
        <div id="bloqueEmpleados" class="hidden">
            <label class="block text-sm font-medium text-gray-700 mb-2">Empleado:</label>
            <div id="empleadosBotones" class="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-2"></div>
            <p class="text-xs text-gray-500">Verde = Fichar Entrada · Rojo = Fichar Salida. Si el nombre está en gris, no tienes permiso para fichar por esa persona.</p>
        </div>

        <!-- Histórico (colapsado) -->
        <div class="border-t mt-8 pt-4">
            <button id="btnToggleLista" type="button" class="w-full flex items-center justify-between bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium px-4 py-3 rounded-lg transition">
                <span>Ver Listado de Fichajes (<span id="contadorFichajes">0</span>)</span>
                <svg id="iconoToggleLista" class="w-5 h-5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>
            <div id="listaFichajesWrapper" class="hidden mt-3">
                <input type="text" id="buscadorFichajes" placeholder="Buscar por empleado o punto de venta..." class="w-full border p-2 rounded mb-3 focus:ring-2 focus:ring-blue-500">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b text-xs font-semibold text-gray-600 uppercase">
                                <th class="p-3">Fecha</th>
                                <th class="p-3">Empleado</th>
                                <th class="p-3">Punto Venta</th>
                                <th class="p-3">Entrada</th>
                                <th class="p-3">Salida</th>
                                <th class="p-3">Horas</th>
                                <th class="p-3">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tablaFichajes" class="divide-y text-sm">
                            <tr><td colspan="7" class="p-4 text-center text-gray-500">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal: Editar Fichaje -->
    <div id="modalEditar" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h2 class="text-lg font-bold text-gray-800">Editar Fichaje</h2>
                <button id="btnCerrarEditar" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
            </div>
            <form id="formEditarFichaje" class="space-y-4 p-4" novalidate>
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Empleado:</label>
                    <select id="editEmpleado" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                        <option value="">-- Selecciona --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Punto de Venta:</label>
                    <select id="editPuntoVenta" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                        <option value="">-- Selecciona --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Hora de Entrada:</label>
                    <input type="datetime-local" id="editHoraEntrada" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Hora de Salida: <span class="text-xs font-normal text-gray-500">(vacío = turno todavía abierto)</span></label>
                    <input type="datetime-local" id="editHoraSalida" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                    Guardar Cambios
                </button>
            </form>
        </div>
    </div>

    <script src="/inout.js"></script>
    <script src="/nav.js"></script>
</body>
</html>
