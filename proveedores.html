<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores - Astra Festum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/nav.css">
</head>
<body class="bg-gray-100 p-6 min-h-screen">
    <div class="max-w-5xl mx-auto bg-white p-6 rounded-lg shadow-md">

        <div class="flex justify-between items-center mb-6 pb-4 border-b">
            <h1 class="text-2xl font-bold text-gray-800">Proveedores</h1>
        </div>

        <!-- Formulario de alta -->
        <form id="formProveedor" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8 border-b pb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Proveedor:</label>
                <input type="text" id="nombreProveedor" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Comercial:</label>
                <input type="text" id="nombreComercial" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">CIF:</label>
                <input type="text" id="cif" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">IBAN:</label>
                <input type="text" id="iban" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Forma de Pago:</label>
                <input type="text" id="formaPago" placeholder="Ej: Transferencia 30 días" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ciudad:</label>
                <input type="text" id="ciudad" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="sm:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Dirección Fiscal:</label>
                <input type="text" id="direccionFiscal" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono:</label>
                <input type="text" id="telefono" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email:</label>
                <input type="email" id="email" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="sm:col-span-2">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                    + Añadir Proveedor
                </button>
            </div>
        </form>

        <!-- Lista -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b text-xs font-semibold text-gray-600 uppercase">
                        <th class="p-3">Nombre</th>
                        <th class="p-3">N. Comercial</th>
                        <th class="p-3">CIF</th>
                        <th class="p-3">Ciudad</th>
                        <th class="p-3">Teléfono</th>
                        <th class="p-3">Email</th>
                        <th class="p-3">Estado</th>
                        <th class="p-3">Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaProveedores" class="divide-y text-sm">
                    <tr><td colspan="8" class="p-4 text-center text-gray-500">Cargando...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script src="/proveedores.js"></script>
    <script src="/nav.js"></script>
</body>
</html>
