<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Astra Festum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/nav.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md m-6">

        <div class="flex justify-between items-center mb-6 pb-4 border-b">
            <h1 class="text-2xl font-bold text-gray-800">Usuarios</h1>
        </div>

        <!-- Formulario de alta -->
        <form id="formUsuario" class="space-y-4 mb-8 border-b pb-6" novalidate>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo:</label>
                    <input type="text" id="nombre" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email:</label>
                    <input type="email" id="email" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña:</label>
                    <input type="password" id="password" minlength="8" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar Contraseña:</label>
                    <input type="password" id="passwordConfirmar" minlength="8" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                    <p id="passwordError" class="text-xs text-red-600 mt-1 hidden">Las contraseñas no coinciden (o tienen menos de 8 caracteres).</p>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Acceso por pestaña:</label>
                <div id="permisosGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2 bg-gray-50 border rounded p-3"></div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                + Añadir Usuario
            </button>
        </form>

        <!-- Lista (colapsada por defecto) -->
        <button id="btnToggleLista" type="button" class="w-full flex items-center justify-between bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium px-4 py-3 rounded-lg transition">
            <span>Ver Listado de Usuarios (<span id="contadorUsuarios">0</span>)</span>
            <svg id="iconoToggleLista" class="w-5 h-5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
            </svg>
        </button>
        <div id="listaUsuariosWrapper" class="hidden mt-3">
            <input type="text" id="buscadorUsuarios" placeholder="Buscar usuario por nombre o email..." class="w-full border p-2 rounded mb-3 focus:ring-2 focus:ring-blue-500">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b text-xs font-semibold text-gray-600 uppercase">
                            <th class="p-3">Nombre</th>
                            <th class="p-3">Email</th>
                            <th class="p-3">Estado</th>
                            <th class="p-3">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios" class="divide-y text-sm">
                        <tr><td colspan="4" class="p-4 text-center text-gray-500">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal: Editar -->
    <div id="modalEditar" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h2 class="text-lg font-bold text-gray-800">Editar Usuario</h2>
                <button id="btnCerrarEditar" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
            </div>
            <form id="formEditarUsuario" class="space-y-4 p-4" novalidate>
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo:</label>
                    <input type="text" id="editNombre" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email:</label>
                    <input type="email" id="editEmail" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nueva Contraseña: <span class="text-xs font-normal text-gray-500">(déjalo vacío para no cambiarla)</span></label>
                    <input type="password" id="editPassword" minlength="8" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                    <p id="editPasswordError" class="text-xs text-red-600 mt-1 hidden">Mínimo 8 caracteres.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Acceso por pestaña:</label>
                    <div id="editPermisosGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2 bg-gray-50 border rounded p-3"></div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                    Guardar Cambios
                </button>
            </form>
        </div>
    </div>

    <script src="/usuarios.js"></script>
    <script src="/nav.js"></script>
</body>
</html>
