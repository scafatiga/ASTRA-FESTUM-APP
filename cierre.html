<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra Festum - Cierre de Caja</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-md">
        
        <!-- Botón para ir al Histórico -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Astra Festum - Cierre de Caja</h1>
            <a href="/historico.html" class="bg-gray-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-700 transition">Ver Histórico</a>
        </div>

        <form id="cierreForm" class="space-y-6">
            <!-- Punto de Venta -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Punto de Venta Actual (Caja Origen):</label>
                <select id="punto_venta" required class="w-full border border-gray-300 rounded-lg p-2.5 bg-white">
                    <option value="Alicante">Alicante</option>
                    <option value="Madrid">Madrid</option>
                    <option value="Malaga">Málaga</option>
                </select>
            </div>

            <!-- Totales -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Total Efectivo (€):</label>
                    <input type="number" step="0.01" id="total_efectivo" required class="w-full border border-gray-300 rounded-lg p-2.5" placeholder="0.00">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Total Tarjeta (€):</label>
                    <input type="number" step="0.01" id="total_tarjeta" required class="w-full border border-gray-300 rounded-lg p-2.5" placeholder="0.00">
                </div>
            </div>

            <!-- Gastos -->
            <div class="border p-4 rounded-lg bg-gray-50">
                <h3 class="font-semibold text-gray-700 mb-3">Gastos / Compras Físicas</h3>
                <div id="gastosContainer" class="space-y-3"></div>
                <button type="button" onclick="agregarGasto()" class="mt-3 bg-gray-200 text-gray-800 px-3 py-1.5 rounded-md text-sm hover:bg-gray-300">+ Agregar Gasto</button>
            </div>

            <!-- Adelantos -->
            <div class="border p-4 rounded-lg bg-gray-50">
                <h3 class="font-semibold text-gray-700 mb-3">Adelantos / Abonos a Empleados</h3>
                <div id="adelantosContainer" class="space-y-3"></div>
                <button type="button" onclick="agregarAdelanto()" class="mt-3 bg-gray-200 text-gray-800 px-3 py-1.5 rounded-md text-sm hover:bg-gray-300">+ Agregar Adelanto</button>
            </div>

            <!-- Observaciones -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones / Notas de Caja:</label>
                <textarea id="observaciones" rows="3" class="w-full border border-gray-300 rounded-lg p-2.5" placeholder="Incidencias, diferencias de caja, etc."></textarea>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition">Registrar Cierre de Caja</button>
        </form>
    </div>

    <script>
        function agregarGasto() {
            const container = document.getElementById('gastosContainer');
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center';
            div.innerHTML = `
                <input type="text" placeholder="Concepto" class="gasto-desc flex-1 border border-gray-300 rounded-md p-2 text-sm" required>
                <input type="number" step="0.01" placeholder="Importe (€)" class="gasto-monto w-28 border border-gray-300 rounded-md p-2 text-sm" required>
                <select class="gasto-pv w-32 border border-gray-300 rounded-md p-2 text-sm">
                    <option value="Alicante">Alicante</option>
                    <option value="Madrid">Madrid</option>
                    <option value="Malaga">Málaga</option>
                </select>
                <button type="button" onclick="this.parentElement.remove()" class="bg-red-600 text-white px-2 py-1.5 rounded-md text-sm hover:bg-red-700">✕</button>
            `;
            container.appendChild(div);
        }

        function agregarAdelanto() {
            const container = document.getElementById('adelantosContainer');
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center';
            div.innerHTML = `
                <input type="text" placeholder="Nombre Empleado" class="adelanto-empleado flex-1 border border-gray-300 rounded-md p-2 text-sm" required>
                <input type="number" step="0.01" placeholder="Importe (€)" class="adelanto-monto w-28 border border-gray-300 rounded-md p-2 text-sm" required>
                <select class="adelanto-pv w-32 border border-gray-300 rounded-md p-2 text-sm">
                    <option value="Alicante">Alicante</option>
                    <option value="Madrid">Madrid</option>
                    <option value="Malaga">Málaga</option>
                </select>
                <button type="button" onclick="this.parentElement.remove()" class="bg-red-600 text-white px-2 py-1.5 rounded-md text-sm hover:bg-red-700">✕</button>
            `;
            container.appendChild(div);
        }

        document.getElementById('cierreForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Validación estricta que permite valores en 0
            const efectivoVal = document.getElementById('total_efectivo').value;
            const tarjetaVal = document.getElementById('total_tarjeta').value;

            const total_efectivo = efectivoVal === "" ? 0 : parseFloat(efectivoVal);
            const total_tarjeta = tarjetaVal === "" ? 0 : parseFloat(tarjetaVal);

            const gastos = Array.from(document.querySelectorAll('#gastosContainer > div')).map(div => ({
                descripcion: div.querySelector('.gasto-desc').value,
                importe: parseFloat(div.querySelector('.gasto-monto').value),
                punto_venta: div.querySelector('.gasto-pv').value
            }));

            const adelantos = Array.from(document.querySelectorAll('#adelantosContainer > div')).map(div => ({
                empleado: div.querySelector('.adelanto-empleado').value,
                importe: parseFloat(div.querySelector('.adelanto-monto').value),
                punto_venta: div.querySelector('.adelanto-pv').value
            }));

            const data = {
                punto_venta: document.getElementById('punto_venta').value,
                total_efectivo,
                total_tarjeta,
                gastos,
                adelantos,
                observaciones: document.getElementById('observaciones').value
            };

            try {
                const response = await fetch('/api/cierres', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert('Cierre de caja registrado exitosamente!');
                    window.location.reload();
                } else {
                    alert('Error al registrar el cierre.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión al enviar el cierre.');
            }
        });
    </script>
</body>
</html>
