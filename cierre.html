<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cierre de Caja - Astra Festum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/nav.css">
</head>
<body class="bg-gray-100 p-6 min-h-screen">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">

        <div class="flex justify-between items-center mb-6 pb-4 border-b">
            <h1 class="text-2xl font-bold text-gray-800">Astra Festum - Cierre de Caja</h1>
        </div>

        <form id="cierreForm" class="space-y-6">

            <!-- Punto de Venta Principal -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Punto de Venta Actual (Caja Origen):</label>
                <select id="puntoVenta" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                    <option value="Alicante">Alicante</option>
                    <option value="Madrid">Madrid</option>
                </select>
            </div>

            <!-- Totales Efectivo y Tarjeta -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Total Efectivo (€):</label>
                    <input type="number" step="0.01" id="totalEfectivo" placeholder="0.00" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Total Tarjeta (€):</label>
                    <input type="number" step="0.01" id="totalTarjeta" placeholder="0.00" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
            </div>

            <!-- Sección de Gastos -->
            <div class="border-t pt-4">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-medium text-gray-700">Gastos / Compras Físicas</label>
                    <button type="button" id="btnAgregarGasto" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded transition">
                        + Agregar Gasto
                    </button>
                </div>
                <div id="gastosContainer" class="space-y-2">
                    <!-- Las filas de gastos se insertan aquí dinámicamente -->
                </div>
            </div>

            <!-- Sección de Adelantos -->
            <div class="border-t pt-4">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-medium text-gray-700">Adelantos / Abonos a Empleados</label>
                    <button type="button" id="btnAgregarAdelanto" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded transition">
                        + Agregar Adelanto
                    </button>
                </div>
                <div id="adelantosContainer" class="space-y-2">
                    <!-- Las filas de adelantos se insertan aquí dinámicamente -->
                </div>
            </div>

            <!-- Observaciones -->
            <div class="border-t pt-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones / Notas de Caja:</label>
                <textarea id="observaciones" rows="3" placeholder="Incidencias, diferencias de caja, etc." class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <!-- Botón de Enviar -->
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                Registrar Cierre de Caja
            </button>
        </form>

        <!-- Histórico de Cierres (colapsado, igual que el resto de formularios) -->
        <div class="border-t mt-6 pt-4">
            <button id="btnToggleHistorico" type="button" class="w-full flex items-center justify-between bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium px-4 py-3 rounded-lg transition">
                <span>Ver Histórico de Cierres (<span id="contadorCierres">0</span>)</span>
                <svg id="iconoToggleHistorico" class="w-5 h-5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>
            <div id="historicoWrapper" class="hidden mt-3">
                <input type="text" id="buscadorCierres" placeholder="Buscar por fecha o punto de venta..." class="w-full border p-2 rounded mb-3 focus:ring-2 focus:ring-blue-500">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b text-xs font-semibold text-gray-600 uppercase">
                                <th class="p-3">Fecha</th>
                                <th class="p-3">Punto Venta</th>
                                <th class="p-3">Efectivo</th>
                                <th class="p-3">Tarjeta</th>
                                <th class="p-3">Total Bruto</th>
                                <th class="p-3">Gastos</th>
                                <th class="p-3">Adelantos</th>
                                <th class="p-3">Cash Neto</th>
                                <th class="p-3">Detalles</th>
                                <th id="thAccion" class="p-3 hidden">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCierres" class="divide-y text-sm">
                            <tr><td colspan="9" class="p-4 text-center text-gray-500">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal: Detalle del Cierre (solo administrador) -->
    <div id="modalDetalle" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-lg w-full max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h2 class="text-lg font-bold text-gray-800">Detalle del Cierre</h2>
                <button id="btnCerrarDetalle" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
            </div>
            <div id="contenidoDetalle" class="p-4 space-y-2 text-sm"></div>
        </div>
    </div>

    <!-- Modal: Editar Cierre (solo administrador) -->
    <div id="modalEditar" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h2 class="text-lg font-bold text-gray-800">Editar Cierre</h2>
                <button id="btnCerrarEditar" class="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
            </div>
            <form id="formEditarCierre" class="space-y-4 p-4" novalidate>
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha:</label>
                    <input type="datetime-local" id="editFecha" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Punto de Venta:</label>
                    <input type="text" id="editPuntoVenta" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Total Efectivo (€):</label>
                    <input type="number" step="0.01" id="editTotalEfectivo" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Total Tarjeta (€):</label>
                    <input type="number" step="0.01" id="editTotalTarjeta" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones:</label>
                    <textarea id="editObservaciones" rows="2" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <p class="text-xs text-gray-500">Los gastos y adelantos del cierre no se editan aquí; solo los totales, el punto de venta y las observaciones.</p>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                    Guardar Cambios
                </button>
            </form>
        </div>
    </div>

    <script src="/cierre.js"></script>
    <script src="/nav.js"></script>
</body>
</html>
