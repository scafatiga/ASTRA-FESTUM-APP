<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cierre de Caja - Astra Festum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/nav.css">
</head>
<body class="bg-gray-100 p-6 min-h-screen">
    <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">

        <div class="flex justify-between items-center mb-6 pb-4 border-b">
            <h1 class="text-2xl font-bold text-gray-800">Astra Festum - Cierre de Caja</h1>
            <a href="/historico.html" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded text-sm font-medium transition">
                Ver Histórico
            </a>
        </div>

        <form id="cierreForm" class="space-y-6">

            <!-- Punto de Venta Principal -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Punto de Venta Actual (Caja Origen):</label>
                <select id="puntoVenta" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500">
                    <option value="Alicante">Alicante</option>
                    <option value="Madrid">Madrid</option>
                </select>
            </div>

            <!-- Totales Efectivo y Tarjeta -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Total Efectivo (€):</label>
                    <input type="number" step="0.01" id="totalEfectivo" placeholder="0.00" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Total Tarjeta (€):</label>
                    <input type="number" step="0.01" id="totalTarjeta" placeholder="0.00" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                </div>
            </div>

            <!-- Venta Total: se calcula sola (Efectivo + Tarjeta) -->
            <div class="bg-gray-50 border rounded-lg p-3 flex justify-between items-center">
                <span class="text-sm font-medium text-gray-700">Venta Total:</span>
                <span id="ventaTotal" class="text-lg font-bold text-gray-900">0.00 €</span>
            </div>

            <!-- Sección de Gastos -->
            <div class="border-t pt-4">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-medium text-gray-700">Gastos / Compras Físicas</label>
                    <button type="button" id="btnAgregarGasto" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded transition w-40 text-center">
                        + Agregar Gasto
                    </button>
                </div>
                <div id="gastosContainer" class="space-y-2">
                    <!-- Las filas de gastos se insertan aquí dinámicamente -->
                </div>
            </div>

            <!-- Sección de Adelantos -->
            <div class="border-t pt-4">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-medium text-gray-700">Adelantos / Abonos a Empleados</label>
                    <button type="button" id="btnAgregarAdelanto" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded transition w-40 text-center">
                        + Agregar Adelanto
                    </button>
                </div>
                <div id="adelantosContainer" class="space-y-2">
                    <!-- Las filas de adelantos se insertan aquí dinámicamente -->
                </div>
            </div>

            <!-- Cash a Ingresar: se calcula solo (Efectivo - Gastos - Adelantos) -->
            <div class="bg-gray-50 border rounded-lg p-3 flex justify-between items-center">
                <span class="text-sm font-medium text-gray-700">Cash a Ingresar:</span>
                <span id="cashAIngresar" class="text-lg font-bold text-gray-900">0.00 €</span>
            </div>

            <!-- Observaciones -->
            <div class="border-t pt-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones / Notas de Caja:</label>
                <textarea id="observaciones" rows="3" placeholder="Incidencias, diferencias de caja, etc." class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <!-- Botón de Enviar -->
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                Registrar Cierre de Caja
            </button>
        </form>
    </div>

    <script src="/cierre.js"></script>
    <script src="/nav.js"></script>
</body>
</html>
