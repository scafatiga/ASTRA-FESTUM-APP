<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Astra Festum</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-lg shadow-md max-w-sm w-full">
        <h1 class="text-2xl font-bold text-gray-800 mb-1 text-center">Astra Festum</h1>
        <p class="text-sm text-gray-500 mb-6 text-center">Crea tu contraseña nueva</p>

        <form id="formReset" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña nueva: <span class="text-xs font-normal text-gray-500">(mínimo 8 caracteres)</span></label>
                <input type="password" id="passwordNueva" minlength="8" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Repetir contraseña nueva:</label>
                <input type="password" id="passwordNuevaRepetir" minlength="8" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
            </div>
            <p id="mensajeReset" class="text-sm hidden"></p>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition shadow">
                Guardar Contraseña
            </button>
        </form>

        <a id="linkVolverLogin" href="/login.html" class="hidden block text-center text-sm text-blue-600 hover:underline mt-4">
            Ir a Iniciar Sesión
        </a>
    </div>

    <script src="/resetear-password.js"></script>
</body>
</html>
